volumes:
  argus_dev_postgres_data:
  argus_temp:


services:
  web:
    build:
      context: .
      dockerfile: ./docker/dev/django/Dockerfile
    volumes:
      - ./app/:/usr/src/app/:z
      - ./frontend/:/usr/src/frontend:z
      - ./data:/usr/src/data/
      - argus_temp:/usr/src/app/temp/
    ports:
      - "${OUTBOUND_PORT:-8000}:${INTERNAL_PORT:-8000}"
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_VITE_DEV_MODE=true
      - DJANGO_VITE_DEV_SERVER_HOST=localhost
      # The browser loads assets straight from vite, so Django must point at the published port
      - DJANGO_VITE_DEV_SERVER_PORT=${VITE_OUTBOUND_PORT:-5173}
    depends_on:
      - db
      - vite
    restart: unless-stopped

  vite:
    build:
      context: .
      dockerfile: ./docker/dev/vite/Dockerfile
    volumes:
      - ./frontend/:/usr/src/frontend
      - ./app/:/usr/src/app/
      # http://jdlm.info/articles/2016/03/06/lessons-building-node-app-docker.html
      - /usr/src/frontend/node_modules
    ports:
      - '${VITE_OUTBOUND_PORT:-5173}:${VITE_OUTBOUND_PORT:-5173}'
    environment:
      - WATCHPACK_POLLING=true
      - DJANGO_PROXY_HOST=web
      - VITE_DEV_SERVER_PORT=${VITE_OUTBOUND_PORT:-5173}
    restart: unless-stopped

  db:
    image: postgres:18
    volumes:
      - argus_dev_postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${SQL_USER}
      - POSTGRES_PASSWORD=${SQL_PASSWORD}
      - POSTGRES_DB=${SQL_DATABASE}
    ports:
      - '${SQL_OUTBOUND_PORT:-${SQL_PORT:-5432}}:5432'
    networks:
      default:
        # Keeps .env files that point SQL_HOST at the old fixed container name working
        aliases:
          - ${SQL_HOST:-db}
    restart: unless-stopped
