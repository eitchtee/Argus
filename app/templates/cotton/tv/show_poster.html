{% load i18n %}

{% trans "Watching" as watching_label %}
{% trans "Completed" as completed_label %}
{% trans "Paused" as paused_label %}
{% trans "Dropped" as dropped_label %}

<a href="{% url 'tv-detail' external_id=show.external_id %}{% if show.provider and show.provider != 'tvdb' %}?provider={{ show.provider }}{% endif %}" hx-boost="true" hx-target="body" hx-swap="innerHTML"
   data-name="{{ show.search_title }}"
   class="poster-card">
  <figure class="poster-card__figure">
    {% if show.poster_url %}
    <img src="{{ show.poster_url }}" alt="{{ show.name }}" loading="lazy"
         class="poster-card__image">
    {% else %}
    <div class="poster-card__fallback flex h-full w-full items-center justify-center text-base-content/30" aria-hidden="true">
      <i data-lucide="tv" class="text-4xl"></i>
    </div>
    {% endif %}
    <div class="poster-card__gradient" aria-hidden="true"></div>
    {% if show.user_rating %}
    <span class="poster-card__rating"
          aria-label="{% trans 'Your rating' %}: {{ show.user_rating }}">
      <i data-lucide="star" aria-hidden="true"></i>
      <span class="tabular-nums">{{ show.user_rating }}</span>
    </span>
    {% endif %}
    <div class="poster-card__badges">
      {% if show.normalized_status %}
      <span class="poster-card__badge
                   {% if show.normalized_status == 'Ended' %}poster-card__badge--success{% elif show.normalized_status == 'Continuing' %}poster-card__badge--info{% else %}poster-card__badge--warning{% endif %}"
            data-tippy-content="{{ show.normalized_status }}">
        <i data-lucide="{% if show.normalized_status == 'Ended' %}circle-check{% elif show.normalized_status == 'Continuing' %}circle-play{% else %}calendar-clock{% endif %}" aria-hidden="true"></i>
        <span class="sr-only">{{ show.normalized_status }}</span>
      </span>
      {% endif %}
      {% if show.user_condition %}
      <span class="poster-card__badge
                   {% if show.user_condition == 'completed' %}poster-card__badge--success{% elif show.user_condition == 'dropped' %}poster-card__badge--error{% elif show.user_condition == 'paused' %}poster-card__badge--warning{% else %}poster-card__badge--info{% endif %}"
            data-tippy-content="{% if show.user_condition == 'completed' %}{{ completed_label }}{% elif show.user_condition == 'dropped' %}{{ dropped_label }}{% elif show.user_condition == 'paused' %}{{ paused_label }}{% else %}{{ watching_label }}{% endif %}">
        <i data-lucide="{% if show.user_condition == 'completed' %}check{% elif show.user_condition == 'dropped' %}circle-minus{% elif show.user_condition == 'paused' %}pause{% else %}play{% endif %}" aria-hidden="true"></i>
        <span class="sr-only">{% if show.user_condition == 'completed' %}{{ completed_label }}{% elif show.user_condition == 'dropped' %}{{ dropped_label }}{% elif show.user_condition == 'paused' %}{{ paused_label }}{% else %}{{ watching_label }}{% endif %}</span>
      </span>
      {% endif %}
    </div>
    <div class="poster-card__copy">
      <h2 class="poster-card__title" title="{{ show.name }}">{{ show.name }}</h2>
      <div class="poster-card__progress-meta" aria-hidden="true">
        <span class="text-xs font-bold leading-none tabular-nums">
          {{ show.watched_episode_count }}/{{ show.total_episode_count }}
        </span>
        {% if show.upcoming_episode_count %}
        <span class="text-[0.65rem] font-semibold leading-none text-white/75 tabular-nums">
          +{{ show.upcoming_episode_count }}
        </span>
        {% endif %}
      </div>
    </div>
  </figure>
  <div class="relative h-[5px] bg-base-300" role="progressbar"
       aria-valuemin="0" aria-valuemax="{{ show.total_episode_count }}"
       aria-valuenow="{{ show.watched_episode_count }}"
       aria-label="{% blocktrans with watched=show.watched_episode_count total=show.total_episode_count %}{{ watched }} of {{ total }} episodes watched{% endblocktrans %}{% if show.upcoming_episode_count %}, +{{ show.upcoming_episode_count }} unreleased{% endif %}">
    <progress class="progress tv-show-poster-progress {% if show.progress_color == 'warning' %}progress-warning{% elif show.progress_color == 'success' %}progress-success{% else %}progress-info{% endif %} block h-[5px] min-h-0 w-full rounded-none [&::-moz-progress-bar]:rounded-none [&::-webkit-progress-bar]:rounded-none [&::-webkit-progress-value]:rounded-none"
              value="{{ show.watched_episode_count }}" max="{% if show.total_episode_count %}{{ show.total_episode_count }}{% else %}1{% endif %}"></progress>
  </div>
</a>
