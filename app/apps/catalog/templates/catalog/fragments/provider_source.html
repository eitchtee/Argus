{% load i18n static %}

<div class="detail-source" aria-label="{% trans 'Metadata source' %}">
  <span>{% trans "Information from" %}</span>
  {% if provider == "tvdb" %}
  <span class="detail-source-logo detail-source-logo--dark">
    <img src="{% static 'img/providers/tvdb-on-dark.png' %}" alt="TVDB" loading="lazy">
  </span>
  <span class="detail-source-logo detail-source-logo--light">
    <img src="{% static 'img/providers/tvdb-on-light.png' %}" alt="TVDB" loading="lazy">
  </span>
  {% elif provider == "tmdb" %}
  <img class="detail-source-logo--tmdb" src="{% static 'img/providers/tmdb.svg' %}" alt="TMDB" loading="lazy">
  {% else %}
  <span class="detail-source-name">{{ provider|upper }}</span>
  {% endif %}
</div>
