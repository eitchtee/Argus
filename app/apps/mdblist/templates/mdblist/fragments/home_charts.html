{% load i18n %}
<section aria-labelledby="mdblist-home-heading">
  <div class="section-heading">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.2em] text-primary">{% trans "Streaming now" %}</p>
      {% include "mdblist/fragments/section_heading.html" with heading_id="mdblist-home-heading" heading=_("Top on streaming") link="https://mdblist.com/lists/official/movies/justwatch-streaming-charts" %}
    </div>
    <a href="{% url 'discover' %}" hx-boost="true" class="btn btn-ghost btn-sm">
      <span>{% trans "Discover more" %}</span>
      <i data-lucide="arrow-right" aria-hidden="true"></i>
    </a>
  </div>

  <form id="mdblist-home-controls" class="mb-3 flex flex-wrap items-center gap-3" onsubmit="return false">
    <div role="tablist" class="tabs tabs-box tabs-sm w-fit">
      <input type="radio" name="media_type" value="movie" role="tab" class="tab" aria-label="{% trans 'Movies' %}" checked
             hx-get="{% url 'mdblist-home-charts' %}" hx-include="#mdblist-home-controls" hx-trigger="change" hx-target="#mdblist-home-rail" hx-swap="innerHTML" hx-indicator="#mdblist-home-rail">
      <input type="radio" name="media_type" value="show" role="tab" class="tab" aria-label="{% trans 'TV Shows' %}"
             hx-get="{% url 'mdblist-home-charts' %}" hx-include="#mdblist-home-controls" hx-trigger="change" hx-target="#mdblist-home-rail" hx-swap="innerHTML" hx-indicator="#mdblist-home-rail">
    </div>
    <div role="tablist" class="tabs tabs-box tabs-sm w-fit">
      <input type="radio" name="timeframe" value="today" role="tab" class="tab" aria-label="{% trans 'Today' %}" checked
             hx-get="{% url 'mdblist-home-charts' %}" hx-include="#mdblist-home-controls" hx-trigger="change" hx-target="#mdblist-home-rail" hx-swap="innerHTML" hx-indicator="#mdblist-home-rail">
      <input type="radio" name="timeframe" value="week" role="tab" class="tab" aria-label="{% trans 'This week' %}"
             hx-get="{% url 'mdblist-home-charts' %}" hx-include="#mdblist-home-controls" hx-trigger="change" hx-target="#mdblist-home-rail" hx-swap="innerHTML" hx-indicator="#mdblist-home-rail">
    </div>
  </form>

  <div id="mdblist-home-rail" class="simkl-rail-target"
       hx-get="{% url 'mdblist-home-charts' %}?media_type=movie&timeframe=today"
       hx-trigger="load"
       hx-target="this"
       hx-swap="innerHTML"
       hx-disinherit="hx-target hx-swap hx-indicator">
    <div class="flex items-center justify-center py-12" aria-live="polite">
      <span class="loading loading-spinner loading-lg" aria-hidden="true"></span>
    </div>
  </div>
</section>
