{% extends "layouts/base.html" %}
{% load i18n %}

{% block title %}{% trans "Calendar" %}{% endblock %}

{% block content %}
<div id="calendar-page" class="space-y-6">
  <section class="section-heading items-start">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.2em] text-primary">{% trans "Release schedule" %}</p>
      <h1 class="text-3xl font-bold tracking-tight text-balance">{% trans "Calendar" %}</h1>
    </div>
  </section>

  <div id="calendar-content"
       hx-get="{{ request.get_full_path }}"
       hx-trigger="load"
       hx-target="this"
       hx-swap="innerHTML"
       hx-disinherit="hx-target hx-swap">
    <div class="flex items-center justify-center py-12" aria-live="polite">
      <span class="loading loading-spinner loading-lg" aria-hidden="true"></span>
    </div>
  </div>
</div>
{% endblock %}
