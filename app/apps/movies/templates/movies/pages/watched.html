{% extends "layouts/base.html" %}
{% load i18n %}

{% block title %}{% trans "Watched Movies" %}{% endblock %}

{% block content %}
<section class="space-y-6">
  <div class="section-heading">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.2em] text-primary">{% trans "Movies" %}</p>
      <h1 class="text-3xl font-bold tracking-tight">{% trans "Watched" %}</h1>
    </div>
  </div>

  <div id="movies-watched-content"
       hx-get="{{ request.get_full_path }}"
       hx-trigger="load"
       hx-target="this"
       hx-swap="innerHTML"
       hx-disinherit="hx-target hx-swap">
    <div class="flex items-center justify-center py-12" aria-live="polite">
      <span class="loading loading-spinner loading-lg" aria-hidden="true"></span>
    </div>
  </div>
</section>
{% endblock %}
