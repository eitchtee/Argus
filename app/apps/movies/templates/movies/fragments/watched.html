{% load i18n %}
<c-library-filters id="movies-watched" :url="request.path" target="movies-watched-content"
                   :genres="genres" :genre="genre"
                   :ratings="ratings" :rating="rating" />

{% if movies %}
<div id="movies-watched-grid" class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">
  {% for movie in movies %}
  <c-movies.movie-poster :movie="movie" :watched="True" :dismiss_on_toggle="True" />
  {% endfor %}
</div>
{% elif is_filtered %}
<div class="empty-state py-12 text-center">{% trans "No movies match these filters." %}</div>
{% else %}
<div class="empty-state py-12 text-center">{% trans "No watched movies yet." %}</div>
{% endif %}
