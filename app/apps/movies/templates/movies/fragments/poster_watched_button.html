{% load i18n %}
{% trans "Mark unwatched" as mark_unwatched_label %}
{% trans "Mark watched" as mark_watched_label %}

<button type="button"
        aria-label="{% if watched %}{{ mark_unwatched_label }}{% else %}{{ mark_watched_label }}{% endif %}"
        aria-pressed="{{ watched|yesno:'true,false' }}"
        data-tippy-content="{% if watched %}{{ mark_unwatched_label }}{% else %}{{ mark_watched_label }}{% endif %}"
        data-watched-toggle
        class="btn btn-success btn-circle btn-lg poster-card__watch-button"
        hx-{% if watched %}delete{% else %}post{% endif %}="{% url 'movie-poster-watched' external_id=movie.external_id %}{% if movie.provider and movie.provider != 'tmdb' %}?provider={{ movie.provider }}{% endif %}"
        {% if dismiss_on_toggle %}
        hx-target="closest .poster-card" hx-swap="delete"
        {% else %}
        hx-target="this" hx-swap="outerHTML"
        {% endif %}
        hx-disabled-elt="this">
  <i class="fa-solid fa-{% if watched %}eye-slash{% else %}eye{% endif %}" aria-hidden="true"></i>
  <span class="sr-only">{% if watched %}{{ mark_unwatched_label }}{% else %}{{ mark_watched_label }}{% endif %}</span>
</button>
