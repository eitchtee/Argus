{% load i18n %}
{% if movies %}
<div class="flex snap-x gap-3 overflow-x-auto pb-2 sm:gap-4 xl:grid xl:grid-cols-6 xl:overflow-visible">
  {% for movie in movies %}
  <c-movies.movie-poster :movie="movie" :watched="False" :removable="True"
      slot_classes="w-[45%] shrink-0 snap-start sm:w-[32%] md:w-[24%] lg:w-[20%] xl:min-w-0 xl:w-auto" />
  {% endfor %}
</div>
{% else %}
<div class="text-subtle py-12 text-center">
  {% trans "Nothing to suggest — add movies to your watchlist." %}
</div>
{% endif %}
